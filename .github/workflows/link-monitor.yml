name: Link Health Monitor

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays at midnight
  workflow_dispatch:

# Add permissions for creating issues
permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install linkcheck
        run: uv tool install linkchecker

      - name: Build 11ty site
        run: |
          npm ci
          npm run build

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run link check
        id: linkcheck
        continue-on-error: true
        run: |
          # Run linkcheck with IPv6 disabled to avoid "Invalid IPv6 URL" errors
          uvx linkchecker \
            --no-status \
            --check-extern \
            --ignore-url="^mailto:" \
            --ignore-url="^tel:" \
            --output=csv \
            --file-output=csv/reports/broken-links.csv \
            --no-warnings \
            --threads=10 \
            --timeout=30 \
            --recursion-level=2 \
            --no-follow-url="^https://twitter\.com" \
            --no-follow-url="^https://x\.com" \
            --no-follow-url="^https://www\.linkedin\.com" \
            --no-follow-url="^https://facebook\.com" \
            --no-follow-url="^https://www\.facebook\.com" \
            _site/index.html || echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: reports/

      - name: Parse results
        if: steps.linkcheck.outcome == 'failure'
        id: parse
        run: |
          if [ -f reports/broken-links.csv ]; then
            BROKEN_COUNT=$(tail -n +2 reports/broken-links.csv | wc -l)
            echo "broken_count=$BROKEN_COUNT" >> $GITHUB_OUTPUT
            
            # Create a summary of broken links (first 10)
            echo "broken_links<<EOF" >> $GITHUB_OUTPUT
            tail -n +2 reports/broken-links.csv | head -10 | while IFS=';' read -r url parent status; do
              echo "- [$status] $url (found on: $parent)" >> $GITHUB_OUTPUT
            done
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "broken_count=0" >> $GITHUB_OUTPUT
            echo "broken_links=No broken links CSV found" >> $GITHUB_OUTPUT
          fi

      - name: Create issue on failure
        if: steps.linkcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const brokenCount = '${{ steps.parse.outputs.broken_count }}';
            const brokenLinks = `${{ steps.parse.outputs.broken_links }}`;
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            
            const body = `## 🔗 Automated Link Health Check Failed
            
            **Date:** ${new Date().toISOString()}
            **Broken Links Found:** ${brokenCount}
            
            ### Sample of Broken Links
            ${brokenLinks}
            
            ### Next Steps
            1. Review the broken links above
            2. Fix or remove broken links from your content
            3. Re-run the workflow to verify fixes
            
            View full reports in the [workflow artifacts](${runUrl})`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔗 Link Health Alert: ${brokenCount} broken links found`,
              body: body,
              labels: ['automated', 'link-check']
            });